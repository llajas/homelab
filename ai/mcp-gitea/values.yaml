---
app-template:
  defaultPodOptions:
    automountServiceAccountToken: false

  controllers:
    mcp-gitea:
      containers:
        app:
          image:
            repository: docker.gitea.com/gitea-mcp-server
            tag: 1.13.0
            pullPolicy: IfNotPresent
          env:
            MCP_MODE: http
            GITEA_HOST: https://git.lajas.tech
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532

  service:
    app:
      controller: mcp-gitea
      type: ClusterIP
      ports:
        http:
          port: 8080
