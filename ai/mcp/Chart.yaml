annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: Proxy mode now uses the actively maintained supergateway package instead of @michlyn/mcpgateway
    - kind: changed
      description: 'proxy.gateway.outputTransport default is now streamableHttp; the legacy streamable-http value is still accepted'
    - kind: added
      description: New proxy.gateway options - messagePath, baseUrl, stateful, sessionTimeout, logLevel, healthEndpoints, cors and extraArgs
    - kind: added
      description: ws output transport for proxy mode
