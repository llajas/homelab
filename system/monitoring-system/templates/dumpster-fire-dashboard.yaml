apiVersion: v1
kind: ConfigMap
metadata:
  name: dumpster-fire-controller-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  dumpster-fire-controller.json: |-
    {
      "uid": "dumpster-fire-controller",
      "title": "Dumpster Fire Controller",
      "tags": ["dumpster-fire", "controller"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-24h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Latest poll succeeded",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "dumpster_fire_poll_success", "refId": "A"}],
          "fieldConfig": {"defaults": {"min": 0, "max": 1, "mappings": [{"type": "value", "options": {"0": {"text": "FAILED", "color": "red"}, "1": {"text": "OK", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": 0}, {"color": "green", "value": 1}]}, "unit": "none"}, "overrides": []},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "Controller enabled",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "dumpster_fire_controller_enabled", "refId": "A"}],
          "fieldConfig": {"defaults": {"min": 0, "max": 1, "mappings": [{"type": "value", "options": {"0": {"text": "DISABLED", "color": "gray"}, "1": {"text": "ENABLED", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "gray", "value": 0}, {"color": "green", "value": 1}]}, "unit": "none"}, "overrides": []},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}
        },
        {
          "id": 3,
          "title": "Activity window active",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "dumpster_fire_activity_active", "refId": "A"}],
          "fieldConfig": {"defaults": {"min": 0, "max": 1, "mappings": [{"type": "value", "options": {"0": {"text": "INACTIVE"}, "1": {"text": "ACTIVE", "color": "orange"}}}], "unit": "none"}, "overrides": []},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0}
        },
        {
          "id": 4,
          "title": "Flame state known",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "dumpster_fire_flame_state_known", "refId": "A"}],
          "fieldConfig": {"defaults": {"min": 0, "max": 1, "mappings": [{"type": "value", "options": {"0": {"text": "UNKNOWN", "color": "red"}, "1": {"text": "KNOWN", "color": "green"}}}], "unit": "none"}, "overrides": []},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0}
        },
        {
          "id": 5,
          "title": "Feed polls by outcome",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (result) (rate(dumpster_fire_polls_total[15m]))", "legendFormat": "{{ "{{" }}result{{ "}}" }}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}
        },
        {
          "id": 6,
          "title": "Poll duration",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(dumpster_fire_poll_duration_seconds_bucket[15m])))", "legendFormat": "p95", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}
        },
        {
          "id": 7,
          "title": "New incidents (24h)",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(increase(dumpster_fire_new_incidents_total[24h]))", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 12}
        },
        {
          "id": 8,
          "title": "Trigger submissions",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (desired_state) (increase(dumpster_fire_trigger_submissions_total[24h]))", "legendFormat": "{{ "{{" }}desired_state{{ "}}" }}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 5, "w": 9, "x": 6, "y": 12}
        },
        {
          "id": 9,
          "title": "Seconds until activity deadline",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "clamp_min(dumpster_fire_activity_deadline_timestamp_seconds - time(), 0)", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 5, "w": 9, "x": 15, "y": 12}
        }
      ]
    }
