kube-prometheus-stack:
  grafana:
    enabled: false
    forceDeployDatasources: true
    forceDeployDashboards: true
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki-gateway.loki
      # Thanos Query for long-term metrics (via Thanos Query Frontend)
      - name: Thanos
        type: prometheus
        url: http://thanos-query-frontend.thanos:9090
        access: proxy
        isDefault: false
        jsonData:
          timeInterval: 30s
  prometheus:
    # Thanos sidecar service for Query to discover
    thanosService:
      enabled: true
    thanosServiceMonitor:
      enabled: true
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      # Thanos sidecar configuration
      thanos:
        # Sidecar image is automatically configured by kube-prometheus-stack
        objectStorageConfig:
          existingSecret:
            name: thanos-objstore-secret
            key: objstore.yml
      # Retention - shorter local retention since Thanos handles long-term
      retention: 2d
      retentionSize: ""
      # External labels for Thanos to identify this Prometheus
      externalLabels:
        cluster: homelab
        replica: "$(POD_NAME)"
      # Replica external label name for deduplication
      replicaExternalLabelName: replica

prometheus-blackbox-exporter:
  fullnameOverride: garage-endpoint-prober
  config:
    modules:
      tcp_connect:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: ip4
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  serviceMonitor:
    enabled: true
    defaults:
      interval: 30s
      scrapeTimeout: 10s
      module: tcp_connect
    targets:
      - name: garage-s3
        url: nas-01.storage.lajas.tech:9000
        additionalMetricsRelabels:
          service: garage
          endpoint: s3
