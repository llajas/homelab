docker-registry:
  image:
    tag: 3.1.2
  configPath: /etc/distribution
  ingress:
    enabled: false  # Migrated to Gateway API HTTPRoute
    # className: nginx  # Migrated to Gateway API
    hosts:
      - &host registry.lajas.tech
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
    tls:
      - secretName: registry-tls-certificate
        hosts:
          - *host
  extraVolumes:
    - name: auth
      emptyDir: {}
  extraVolumeMounts:
    - mountPath: /auth
      name: auth
  # TODO uncomment to enable auth
  extraEnvVars:
    - name: REGISTRY_STORAGE_DELETE_ENABLED
      value: "true"
  #   - name: REGISTRY_AUTH
  #     value: "htpasswd"
  #   - name: REGISTRY_AUTH_HTPASSWD_REALM
  #     value: "Registry Realm"
  #   - name: REGISTRY_AUTH_HTPASSWD_PATH
  #     value: "/auth/htpasswd"
  # initContainers:
  #   - name: htpasswd
  #     image: httpd:2-alpine
  #     command:
  #       - sh
  #       - -c
  #       - htpasswd -Bbn "${username}" "${password}" > /auth/htpasswd
  #     envFrom:
  #       - secretRef:
  #           name: registry-admin-secret
  #     volumeMounts:
  #       - mountPath: /auth
  #         name: auth
  persistence:
    enabled: true
    # Recreated as RWX; registry images are disposable and will be rebuilt.
    existingClaim: registry-docker-registry-rwx
    size: 50Gi
  garbageCollect:
    # The read-only coordinator below replaces the chart's online GC CronJob.
    enabled: false
    deleteUntagged: false
    schedule: "0 1 * * *" # Runs daily at 1 AM
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  configData:
    storage:
      cache:
        blobdescriptor: disabled
  replicaCount: 1
  secrets:
    # Local chart patch disables the generated random secret; see docker-registry-3.0.0.patch.
    existingSecret: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
