apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: gitea-kanidm-oauth-source
  namespace: global-secrets
spec:
  itemPath: "vaults/z3emsr5qi5xqk33wthv5fpmfqa/items/homelab-kanidm-gitea-oidc-client-secret"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-kanidm-oauth
  namespace: gitea
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: gitea-kanidm-oauth
    template:
      engineVersion: v2
      type: Opaque
      data:
        key: gitea
        secret: {{` "{{ .password }}" `}}
  data:
    - secretKey: password
      remoteRef:
        key: gitea-kanidm-oauth-source
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
