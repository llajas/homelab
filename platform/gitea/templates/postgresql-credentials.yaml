apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: gitea-postgresql-credentials-source
  namespace: global-secrets
spec:
  itemPath: "vaults/z3emsr5qi5xqk33wthv5fpmfqa/items/yhhlhqlcgdp7bjuvgk5pzgcg44"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitea-postgresql-credentials
  namespace: gitea
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: gitea-postgresql-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: gitea-postgresql-credentials-source
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: postgres-password
      remoteRef:
        key: gitea-postgresql-credentials-source
        property: postgres-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
