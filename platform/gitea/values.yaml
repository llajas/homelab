gitea:
  # shortcut: Recreate avoids RWO multi-attach; revisit after a RWX/HA storage move.
  strategy:
    type: Recreate
  ingress:
    enabled: false
    # className: nginx  # Migrated to Gateway API
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      hajimari.io/appName: Gitea
      hajimari.io/icon: git
    hosts:
      - host: &host git.lajas.tech
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: gitea-tls-certificate
        hosts:
          - *host
  gitea:
    admin:
      existingSecret: gitea-admin-secret
    oauth:
      - name: Kanidm
        provider: openidConnect
        existingSecret: gitea-kanidm-oauth
        autoDiscoverUrl: https://auth.lajas.tech/oauth2/openid/gitea/.well-known/openid-configuration
        scopes: email profile groups
    additionalConfigFromEnvs:
      - name: GITEA__DATABASE__PASSWD
        valueFrom:
          secretKeyRef:
            name: gitea-postgresql-credentials
            key: password
    config:
      server:
        LANDING_PAGE: explore
        ROOT_URL: https://git.lajas.tech
      webhook:
        ALLOWED_HOST_LIST: private
  persistence:
    storageClass: longhorn
  postgresql:
    enabled: true
    auth:
      username: gitea
      database: gitea
      enablePostgresUser: true
      existingSecret: gitea-postgresql-credentials
    image:
      tag: "16.6.0-debian-12-r2"
    persistence:
      storageClass: longhorn
  postgresql-ha:
    enabled: false
  valkey-cluster:
    cluster:
      nodes: 6
    persistence:
      size: 1Gi

sshLoadBalancer:
  enabled: true
  hostnames: git.lajas.tech
  ip: 10.138.0.226
  sharingKey: public-gateway
  sharingCrossNamespace: kube-system
