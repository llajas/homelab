dex:
  config:
    issuer: https://dex.lajas.tech
    storage:
      type: kubernetes
      config:
        inCluster: true
    oauth2:
      skipApprovalScreen: true
    connectors:
      - type: oidc
        id: kanidm
        name: Kanidm
        config:
          clientID: $KANIDM_CLIENT_ID
          clientSecret: $KANIDM_CLIENT_SECRET
          redirectURI: https://dex.lajas.tech/callback
          issuer: https://auth.lajas.tech/oauth2/openid/dex
          # TODO https://github.com/dexidp/dex/pull/3188
          # enablePKCE: true
          scopes:
            - openid
            - profile
            - email
            - groups
          insecureEnableGroups: true
    staticClients:
      - id: grafana-sso
        name: Grafana
        redirectURIs:
          - 'https://grafana.lajas.tech/login/generic_oauth'
        secretEnv: GRAFANA_SSO_CLIENT_SECRET
      - id: gitea
        name: Gitea
        redirectURIs:
          - 'https://git.lajas.tech/user/oauth2/Dex/callback'
        secretEnv: GITEA_CLIENT_SECRET
      - id: open-webui
        name: Open WebUI
        redirectURIs:
          - https://open-webui.lajas.tech/oauth/oidc/callback
        secretEnv: OPEN_WEBUI_CLIENT_SECRET
      - id: planka
        name: Planka
        redirectURIs:
          - https://planka.lajas.tech/oidc-callback
        secretEnv: PLANKA_CLIENT_SECRET
      - id: neko
        name: Neko
        redirectURIs:
          - https://neko.lajas.tech/api/oauth/callback
        secretEnv: NEKO_CLIENT_SECRET
  envFrom:
    - secretRef:
        name: dex-secrets
  envVars:
    - name: NEKO_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: neko-oauth
          key: client_secret
  podAnnotations:
    operator.1password.io/item-path: "vaults/z3emsr5qi5xqk33wthv5fpmfqa/items/ks6xswihxos3f46mkdvufwvb3u"
    operator.1password.io/item-name: "neko-oauth"
    operator.1password.io/auto-restart: "true"
  ingress:
    enabled: false  # Migrated to Gateway API HTTPRoute
