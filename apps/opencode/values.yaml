app-template:
  defaultPodOptions:
    automountServiceAccountToken: false

  serviceAccount:
    opencode: {}

  controllers:
    opencode:
      strategy: Recreate
      serviceAccount:
        identifier: opencode
      pod:
        terminationGracePeriodSeconds: 60
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
      initContainers:
        prepare-tmux-ssh:
          image:
            repository: busybox
            tag: "1.37"
          command:
            - sh
            - -c
            - |
              set -eu
              cp /tmux-ssh-source/id_ed25519 /tmux-ssh/id_ed25519
              cp /tmux-ssh-source/known_hosts /tmux-ssh/known_hosts
              chmod 0600 /tmux-ssh/id_ed25519
              chmod 0644 /tmux-ssh/known_hosts
              chown 1000:1000 /tmux-ssh/id_ed25519 /tmux-ssh/known_hosts
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
            runAsUser: 0
      containers:
        app:
          image:
            repository: registry.lajas.tech/opencode
            tag: "sha-74f0c1ae@sha256:5eea4dee9b7b2f00f90ed12e30125e83cf25e25dd087c9f2df6193c345366939"
            pullPolicy: IfNotPresent
          args:
            - serve
            - --hostname
            - 127.0.0.1
            - --port
            - "4097"
          env:
            HOME: /home/opencode
            TZ: America/Chicago
            XDG_CACHE_HOME: /home/opencode/.cache
            XDG_CONFIG_HOME: /home/opencode/.config
            XDG_DATA_HOME: /home/opencode/.local/share
            XDG_STATE_HOME: /home/opencode/.local/state
            OPENCODE_CONFIG: /etc/opencode-managed/opencode.json
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - curl
                    - --fail
                    - --silent
                    - --show-error
                    - --output
                    - /dev/null
                    - http://127.0.0.1:4097/global/health
                failureThreshold: 30
                periodSeconds: 5
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - curl
                    - --fail
                    - --silent
                    - --show-error
                    - --output
                    - /dev/null
                    - http://127.0.0.1:4097/global/health
                periodSeconds: 15
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command:
                    - curl
                    - --fail
                    - --silent
                    - --show-error
                    - --output
                    - /dev/null
                    - http://127.0.0.1:4097/global/health
                periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
        proxy:
          image:
            repository: nginxinc/nginx-unprivileged
            tag: "1.29.1-alpine@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e"
            pullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
          probes:
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 4096
                failureThreshold: 30
                periodSeconds: 5
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 4096
                periodSeconds: 15
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 4096
                periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi

  service:
    opencode:
      controller: opencode
      type: ClusterIP
      ports:
        http:
          port: 4096

  persistence:
    home:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 20Gi
      storageClass: longhorn
      retain: true
      advancedMounts:
        opencode:
          app:
            - path: /home/opencode
    workspace:
      type: persistentVolumeClaim
      existingClaim: opencode-ghq
      advancedMounts:
        opencode:
          app:
            - path: /workspace/ghq
    tmp:
      type: emptyDir
      advancedMounts:
        opencode:
          app:
            - path: /tmp
          proxy:
            - path: /tmp
    proxy-config:
      type: configMap
      name: opencode-proxy-config
      advancedMounts:
        opencode:
          proxy:
            - path: /etc/nginx/conf.d/default.conf
              readOnly: true
              subPath: default.conf
    managed-config:
      type: configMap
      name: opencode-managed-config
      advancedMounts:
        opencode:
          app:
            - path: /etc/opencode-managed
              readOnly: true
    tmux-ssh:
      type: secret
      name: opencode-tmux-ssh
      defaultMode: 0440
      items:
        - key: private-key
          path: id_ed25519
        - key: known_hosts
          path: known_hosts
      advancedMounts:
        opencode:
          prepare-tmux-ssh:
            - path: /tmux-ssh-source
              readOnly: true
    tmux-ssh-runtime:
      type: emptyDir
      advancedMounts:
        opencode:
          prepare-tmux-ssh:
            - path: /tmux-ssh
          app:
            - path: /home/opencode/.ssh/tmux-mcp
    proxy-auth:
      type: secret
      name: opencode-server-auth
      items:
        - key: htpasswd
          path: htpasswd
      advancedMounts:
        opencode:
          proxy:
            - path: /etc/nginx/auth
              readOnly: true

workspace:
  capacity: 1Ti
  storageClass: nfs
  accessMode: ReadWriteMany
  nfs:
    server: nas-01.storage.lajas.tech
    path: /mnt/user/ghq

opSecrets:
  vault: z3emsr5qi5xqk33wthv5fpmfqa
  secrets:
    - item: 4msntvjd4yesnjuli2ywrkic5i
      secretName: opencode-server-auth
    - item: 4akfuxcnmy4ittsanxbnnyz6xi
      secretName: opencode-tmux-ssh

httpRoute:
  host: opencode.lajas.tech
  gateway:
    name: public-gateway
    namespace: kube-system
