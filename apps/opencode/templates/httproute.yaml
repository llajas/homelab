apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencode
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ .Values.httpRoute.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: opencode
          port: 4096
          weight: 1
