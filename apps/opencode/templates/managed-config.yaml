apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-managed-config
  namespace: {{ .Release.Namespace }}
data:
  opencode.json: |-
    {
      "$schema": "https://opencode.ai/config.json",
      "mcp": {
        "kubernetes": {
          "type": "remote",
          "url": "http://mcp-kubernetes.mcp-kubernetes.svc.cluster.local:8080/mcp",
          "enabled": true,
          "oauth": false,
          "timeout": 30000
        },
        "woodpecker": {
          "type": "remote",
          "url": "https://mcp-woodpecker.lajas.tech/mcp",
          "enabled": true,
          "oauth": false,
          "headers": {
            "Authorization": "Bearer {env:WOODPECKER_TOKEN}"
          }
        },
        "atuin": {
          "type": "local",
          "command": ["/usr/local/bin/atuin", "mcp"],
          "enabled": true,
          "timeout": 30000
        },
        "tmux": {
          "type": "remote",
          "url": "http://mcp-tmux.mcp-tmux.svc.cluster.local:8080/mcp",
          "enabled": true,
          "oauth": false,
          "headers": {
            "Authorization": "Bearer {env:OPENCODE_API_KEY}"
          },
          "timeout": 30000
        }
      }
    }
