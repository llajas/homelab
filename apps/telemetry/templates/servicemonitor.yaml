apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: telemetry
  namespace: {{ .Release.Namespace }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: telemetry
      app.kubernetes.io/name: telemetry
      app.kubernetes.io/service: telemetry
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
