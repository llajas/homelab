apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: neko-oauth
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: neko-oauth
  data:
    - secretKey: client_secret
      remoteRef:
        key: dex.neko
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
