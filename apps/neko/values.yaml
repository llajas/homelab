app-template:
  defaultPodOptions:
    annotations:
      operator.1password.io/item-path: "vaults/z3emsr5qi5xqk33wthv5fpmfqa/items/ks6xswihxos3f46mkdvufwvb3u"
      operator.1password.io/item-name: "neko-oauth"
      operator.1password.io/auto-restart: "true"
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0

  controllers:
    main:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: nvidia.com/gpu.present
                      operator: In
                      values:
                        - "true"
        runtimeClassName: nvidia
      initContainers:
        chown-data:
          image:
            repository: busybox
            tag: latest
          command:
            - sh
            - -c
            - chown -R 1000:1000 /home/neko/.local/share/neko /home/neko/Downloads
          securityContext:
            runAsUser: 0
      containers:
        main:
          image:
            repository: ghcr.io/m1k1o/neko/nvidia-microsoft-edge
            tag: 3.2.0
            pullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: webrtctcp
              containerPort: 52100
              protocol: TCP
            - name: webrtcudp
              containerPort: 52100
              protocol: UDP
          env:
            # --- server ---
            NEKO_SERVER_BIND: ":8080"
            NEKO_SERVER_PATH_PREFIX: "/"
            NEKO_SERVER_PROXY: "true"

            # --- session/ui ---
            NEKO_DESKTOP_SCREEN: "1920x1080@30"
            NEKO_SESSION_CONTROL_PROTECTION: "false"
            NEKO_SESSION_IMPLICIT_HOSTING: "false"
            NEKO_SESSION_COOKIE_ENABLED: "true"
            NEKO_SESSION_MERCIFUL_RECONNECT: "true"
            NEKO_SESSION_HEARTBEAT_INTERVAL: "10"
            # Persist sessions to disk so reconnects survive pod restarts
            NEKO_SESSION_FILE: "/home/neko/.local/share/neko/sessions.json"
            NEKO_MEMBER_PROVIDER: "oauth"
            NEKO_MEMBER_OAUTH_ENABLED: "true"
            NEKO_MEMBER_OAUTH_AUTO_REDIRECT: "true"
            NEKO_MEMBER_OAUTH_NAME: "Lajas.tech SSO"
            NEKO_MEMBER_OAUTH_ADMIN_EMAILS: "llajas@auth.lajas.tech"
            NEKO_MEMBER_OAUTH_CLIENT_ID: "neko"
            NEKO_MEMBER_OAUTH_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: neko-oauth
                  key: client_secret
            NEKO_MEMBER_OAUTH_ISSUER_URL: "https://dex.lajas.tech"
            NEKO_MEMBER_OAUTH_REDIRECT_URL: "https://neko.lajas.tech/api/oauth/callback"
            NEKO_FILE_TRANSFER_ENABLED: "true"
            NEKO_FILE_TRANSFER_PATH: "/home/neko/Downloads"

            # --- desktop/input ---
            NEKO_DESKTOP_INPUT_ENABLED: true
            NEKO_DESKTOP_INPUT_SOCKET: "/tmp/xf86-input-neko.sock"

            # --- nvidia/gpu ---
            NVIDIA_VISIBLE_DEVICES: all
            NVIDIA_DRIVER_CAPABILITIES: all
            NEKO_CAPTURE_VIDEO_PIPELINE: |
              ximagesrc display-name={display} show-pointer=true use-damage=false
                ! video/x-raw,framerate=25/1
                ! cudaupload ! cudaconvert ! queue
                ! video/x-raw(memory:CUDAMemory),format=NV12
                ! nvh264enc
                  name=encoder
                  preset=2
                  gop-size=25
                  spatial-aq=true
                  temporal-aq=true
                  bitrate=4096
                  vbv-buffer-size=4096
                  rc-mode=6
                ! h264parse config-interval=-1
                ! video/x-h264,stream-format=byte-stream
                ! appsink name=appsink
            NEKO_CAPTURE_VIDEO_CODEC: "h264"

            # --- webrtc (correct keys) ---
            NEKO_WEBRTC_EPR: "0-0"                    # disable ephemeral port range
            NEKO_WEBRTC_UDPMUX: "52100"
            NEKO_WEBRTC_TCPMUX: "52100"
            NEKO_WEBRTC_ICELITE: "true"
            NEKO_WEBRTC_ICETRICKLE: "true"
            NEKO_WEBRTC_ICESERVERS_FRONTEND: '[{"urls":["stun:stun.l.google.com:19302"]}]'
            NEKO_WEBRTC_ICESERVERS_BACKEND: '[{"urls":["stun:stun.l.google.com:19302"]}]'
            NEKO_WEBRTC_NAT1TO1: "10.138.0.231"

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: false

  service:
    main:
      controller: main
      primary: true
      ports:
        http:
          port: 8080
          targetPort: http
          protocol: HTTP
          appProtocol: kubernetes.io/ws
          primary: true

    webrtc:
      controller: main
      type: LoadBalancer
      externalTrafficPolicy: Local
      loadBalancerIP: 10.138.0.231
      labels:
        io.cilium/bgp-announce: "true"
      annotations:
        lbipam.cilium.io/ips: 10.138.0.231
        io.cilium/bgp-announce: "true"
      ports:
        tcpmux:
          port: 52100
          targetPort: 52100
          protocol: TCP
        udpmux:
          port: 52100
          targetPort: 52100
          protocol: UDP

  ingress:
    main:
      enabled: false
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
        nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
        nginx.ingress.kubernetes.io/enable-websocket: "true"
        nginx.ingress.kubernetes.io/upstream-vhost: "localhost"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-body-size: "100m"
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      hosts:
        - host: neko.lajas.tech
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: neko-tls
          hosts:
            - neko.lajas.tech

  persistence:
    data:
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /home/neko/.local/share/neko
          chown-data:
            - path: /home/neko/.local/share/neko
    downloads:
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /home/neko/Downloads
          chown-data:
            - path: /home/neko/Downloads

httpRoute:
  enabled: true
  name: neko
  host: neko.lajas.tech
  annotations: {}
