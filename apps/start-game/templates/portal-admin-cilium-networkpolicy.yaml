apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: portal-admin-gateway
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: portal-admin
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
