apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: start-game
  namespace: {{ .Release.Namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/target: homelab-tunnel.lajas.tech
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ .Values.httpRoute.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.httpRoute.backendService }}
          port: {{ .Values.httpRoute.backendPort }}
          weight: 1
