apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal-admin
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.httpRouteAdmin.gateway.name }}
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.httpRouteAdmin.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ .Values.httpRouteAdmin.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.httpRouteAdmin.backendService }}
          port: {{ .Values.httpRouteAdmin.backendPort }}
          weight: 1
