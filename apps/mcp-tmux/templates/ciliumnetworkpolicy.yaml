---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-tmux
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: opencode
            k8s:app.kubernetes.io/name: opencode
            k8s:app.kubernetes.io/instance: opencode
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-agent
            k8s:app.kubernetes.io/name: hermes-agent
            k8s:app.kubernetes.io/instance: hermes-agent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toFQDNs:
        - matchName: mt-silver.johto.lajas.tech
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
    - toFQDNs:
        - matchName: registry.npmjs.org
        - matchName: github.com
        - matchPattern: "*.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
