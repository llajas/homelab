global:
  nameOverride: homeassistant

app-template:
  controllers:
    main:
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/home-assistant/home-assistant
            tag: 2026.8.2
            pullPolicy: IfNotPresent
          env:
            TZ: America/Chicago
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8123
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8123
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8123
                periodSeconds: 5
                timeoutSeconds: 1
                failureThreshold: 30
        matter:
          image:
            repository: ghcr.io/matter-js/matterjs-server
            tag: stable
            pullPolicy: IfNotPresent
          args:
            - --storage-path
            - /data
          env:
            TZ: America/Chicago
            LOG_LEVEL: info
          ports:
            - name: matter
              containerPort: 5580
              protocol: TCP
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 5580
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 5580
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 5580
                periodSeconds: 5
                timeoutSeconds: 1
                failureThreshold: 30

  service:
    main:
      controller: main
      ports:
        http:
          port: 8123
          targetPort: http
          protocol: HTTP

  serviceMonitor:
    main:
      enabled: true
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}'
      endpoints:
        - port: http
          scheme: http
          path: /api/prometheus
          interval: 1m
          scrapeTimeout: 30s

  persistence:
    config:
      enabled: true
      existingClaim: homeassistant-home-assistant-config
      advancedMounts:
        main:
          main:
            - path: /config
    matter:
      enabled: true
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          matter:
            - path: /data

  defaultPodOptions:
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet

httpRoute:
  enabled: true
  name: homeassistant
  host: home-assistant.lajas.tech
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    hajimari.io/appName: Home-Assistant
    hajimari.io/icon: home-assistant

metrics:
  enabled: true
  prometheusRule:
    enabled: true
    labels: {}
