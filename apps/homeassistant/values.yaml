global:
  nameOverride: homeassistant

app-template:
  controllers:
    main:
      strategy: Recreate
      initContainers:
        merge-custom-config:
          image:
            repository: busybox
            tag: 1.37.0
            pullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              touch /config/configuration.yaml;
              if grep -q 'use_x_forwarded_for' /config/configuration.yaml; then
                echo "Configuration already exists, skipping append.";
              else
                echo "Appending custom configuration.";
                printf '\n' >> /config/configuration.yaml;
                cat /custom-config/custom-config.yaml >> /config/configuration.yaml;
              fi;
      containers:
        main:
          image:
            repository: ghcr.io/home-assistant/home-assistant
            tag: 2026.8.2
            pullPolicy: IfNotPresent
          env:
            TZ: America/Chicago
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8123
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8123
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8123
                periodSeconds: 5
                timeoutSeconds: 1
                failureThreshold: 30

  service:
    main:
      controller: main
      ports:
        http:
          port: 8123
          targetPort: http
          protocol: HTTP

  serviceMonitor:
    main:
      enabled: true
      serviceName: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}'
      endpoints:
        - port: http
          scheme: http
          path: /api/prometheus
          interval: 1m
          scrapeTimeout: 30s

  persistence:
    config:
      enabled: true
      existingClaim: homeassistant-home-assistant-config
      advancedMounts:
        main:
          main:
            - path: /config
          merge-custom-config:
            - path: /config
    custom-config:
      enabled: true
      type: configMap
      name: home-assistant-custom-config
      advancedMounts:
        main:
          main:
            - path: /custom-config
              readOnly: true
          merge-custom-config:
            - path: /custom-config
              readOnly: true

  defaultPodOptions:
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet

httpRoute:
  enabled: true
  name: homeassistant
  host: home-assistant.lajas.tech
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    hajimari.io/appName: Home-Assistant
    hajimari.io/icon: home-assistant

metrics:
  enabled: true
  prometheusRule:
    enabled: true
    labels: {}
