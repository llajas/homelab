app-template:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

  controllers:
    dumpster-fire-controller:
      replicas: 1
      strategy: Recreate
      annotations:
        operator.1password.io/auto-restart: "true"
        operator.1password.io/item-path: "vaults/z3emsr5qi5xqk33wthv5fpmfqa/items/m6xfspsmb26pvptji2mem7bivu"
        operator.1password.io/item-name: dumpster-fire-api
      pod:
        terminationGracePeriodSeconds: 30
      containers:
        app:
          image:
            repository: registry.lajas.tech/dumpster-fire-controller
            tag: sha-3bd34194
            pullPolicy: Always
          env:
            AUSTIN_FIRE_HOST:
              valueFrom:
                secretKeyRef:
                  name: dumpster-fire-api
                  key: host
            AUSTIN_FIRE_API_KEY:
              valueFrom:
                secretKeyRef:
                  name: dumpster-fire-api
                  key: api-key
            AUSTIN_FIRE_ENABLED: "true"
            AUSTIN_FIRE_STATE_PATH: /data/austin_dumpster_fire_state.json
            AUSTIN_FIRE_TIMEOUT_MINUTES: "15"
            PYTHONDONTWRITEBYTECODE: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: status
              containerPort: 8080
              protocol: TCP
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: status
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /status
                  port: status
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi

  service:
    status:
      controller: dumpster-fire-controller
      type: ClusterIP
      ports:
        http:
          port: 8080
          targetPort: status

  persistence:
    state:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 256Mi
      storageClass: longhorn
      retain: true
      advancedMounts:
        dumpster-fire-controller:
          app:
            - path: /data

opSecrets:
  vault: z3emsr5qi5xqk33wthv5fpmfqa
  secrets:
    - item: m6xfspsmb26pvptji2mem7bivu
      secretName: dumpster-fire-api
