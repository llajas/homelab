apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dumpster-fire-controller
  namespace: {{ .Release.Namespace }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: dumpster-fire
      app.kubernetes.io/name: dumpster-fire
      app.kubernetes.io/service: dumpster-fire
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
