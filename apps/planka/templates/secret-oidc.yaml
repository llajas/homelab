{{- if .Values.oidc.enabled }}
{{- if and .Values.oidc.existingSecret .Values.oidc.clientSecretExistingSecret -}}
  {{- fail "Set only one of `existingSecret` and `clientSecretExistingSecret`" -}}
{{- end }}
{{- if and .Values.oidc.existingSecret (or .Values.oidc.clientId .Values.oidc.clientSecret) -}}
  {{- fail "Do not combine `existingSecret` with inline OIDC credentials" -}}
{{- end }}
{{- if and (not .Values.oidc.existingSecret) (not .Values.oidc.clientSecretExistingSecret) (and .Values.oidc.clientId .Values.oidc.clientSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "planka.fullname" . }}-oidc
  labels:
    {{- include "planka.labels" . | nindent 4 }}
type: Opaque
data:
  clientId: {{ .Values.oidc.clientId | b64enc | quote }}
  clientSecret: {{ .Values.oidc.clientSecret | b64enc | quote }}
{{- end }}
{{- end }}
