# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json

sonarr:
  series:
    base_url: !env_var SONARR_BASE_URL
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
      qualities:
        - name: HDTV-720p
          max: 50
          preferred: 30
        - name: WEBRip-720p
          max: 50
          preferred: 30
        - name: WEBDL-720p
          max: 50
          preferred: 30
        - name: HDTV-1080p
          max: 50
          preferred: 32.5
        - name: WEBRip-1080p
          max: 50
          preferred: 32.5
        - name: WEBDL-1080p
          max: 50
          preferred: 32.5
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
      - name: Anime WEB-1080p
        trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        qualities:
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p

radarr:
  movies:
    base_url: !env_var RADARR_BASE_URL
    api_key: !env_var RADARR_API_KEY
    quality_definition:
      type: movie
      qualities:
        - name: HDTV-720p
          max: 75
          preferred: 46.05
        - name: WEBRip-720p
          max: 75
          preferred: 43.75
        - name: WEBDL-720p
          max: 75
          preferred: 43.75
        - name: Bluray-720p
          max: 75
          preferred: 50.35
        - name: HDTV-1080p
          max: 125
          preferred: 79.4
        - name: WEBRip-1080p
          max: 125
          preferred: 68.75
        - name: WEBDL-1080p
          max: 125
          preferred: 68.75
        - name: Bluray-1080p
          max: 125
          preferred: 87.9
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
