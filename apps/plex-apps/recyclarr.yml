# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json

sonarr:
  series:
    base_url: !env_var SONARR_BASE_URL
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
      qualities:
        - name: HDTV-720p
          max: 50
          preferred: 30
        - name: WEBRip-720p
          max: 50
          preferred: 30
        - name: WEBDL-720p
          max: 50
          preferred: 30
        - name: HDTV-1080p
          max: 50
          preferred: 32.5
        - name: WEBRip-1080p
          max: 50
          preferred: 32.5
        - name: WEBDL-1080p
          max: 50
          preferred: 32.5
