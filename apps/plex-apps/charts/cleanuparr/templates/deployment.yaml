apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cleanuparr.fullname" . }}
  labels: {}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: {{ include "cleanuparr.fullname" . }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        ports:
        - containerPort: {{ .Values.service.port }}
          name: cleanuparr
        env:
        {{- range .Values.env }}
        {{- $pair := . | toYaml | fromYaml }}
        {{- range $key, $value := $pair }}
        - name: {{ $key }}
          value: "{{ $value }}"
        {{- end }}
        {{- end }}
        {{- if or .Values.persistentVolume.enabled .Values.persistence.media.enabled }}
        volumeMounts:
        {{- if .Values.persistentVolume.enabled }}
        - name: config
          mountPath: /config
        {{- end }}
        {{- if .Values.persistence.media.enabled }}
        - name: media
          mountPath: {{ .Values.persistence.media.mountPath }}
        {{- end }}
        {{- end }}
      {{- if or .Values.persistentVolume.enabled .Values.persistence.media.enabled }}
      volumes:
      {{- if .Values.persistentVolume.enabled }}
      - name: config
        persistentVolumeClaim:
          claimName: {{ if .Values.persistentVolume.existingClaim }}{{ .Values.persistentVolume.existingClaim }}{{ else }}{{ include "cleanuparr.fullname" . }}-config{{ end }}
      {{- end }}
      {{- if .Values.persistence.media.enabled }}
      - name: media
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.media.existingClaim }}
      {{- end }}
      {{- end }}
