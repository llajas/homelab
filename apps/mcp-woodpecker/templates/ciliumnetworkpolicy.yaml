---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-woodpecker
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: mcp-woodpecker
      app.kubernetes.io/instance: mcp-woodpecker
      app.kubernetes.io/name: mcp-woodpecker
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-agent
            k8s:app.kubernetes.io/instance: hermes-agent
            k8s:app.kubernetes.io/name: hermes-agent
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
