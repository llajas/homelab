hermes-agent:
  fullnameOverride: hermes-agent
  config:
    mcp_servers:
      tmux:
        url: http://mcp-tmux.mcp-tmux.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer ${MCP_TMUX_API_KEY}"
        trust: untrusted
        tools:
          resources: false
          prompts: false
    model:
      provider: openai-codex
      default: gpt-5.6-terra
    dashboard:
      oauth:
        self_hosted:
          issuer: https://auth.lajas.tech/oauth2/openid/hermes-agent
  auth:
    deviceFlow:
      enabled: true
      provider: openai-codex
      notify: logs
  env:
    OPENAI_API_KEY: unused
  extraEnvFrom:
    - secretRef:
        name: hermes-agent-secrets
  extraEnv:
    - name: MCP_TMUX_API_KEY
      valueFrom:
        secretKeyRef:
          name: mcp-tmux-auth
          key: OPENCODE_API_KEY
    - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: hermes-agent-oidc-client-id
          key: client_id
  extraResources:
    - apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: mcp-tmux-auth
        namespace: "{{ .Release.Namespace }}"
      spec:
        itemPath: vaults/z3emsr5qi5xqk33wthv5fpmfqa/items/4msntvjd4yesnjuli2ywrkic5i
    - apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: hermes-agent-secrets
        namespace: "{{ .Release.Namespace }}"
      spec:
        itemPath: vaults/z3emsr5qi5xqk33wthv5fpmfqa/items/gy7zr4o7r3ziuibzqktblqnooa
    - apiVersion: onepassword.com/v1
      kind: OnePasswordItem
      metadata:
        name: hermes-agent-oidc-client-id
        namespace: "{{ .Release.Namespace }}"
      spec:
        itemPath: vaults/z3emsr5qi5xqk33wthv5fpmfqa/items/xcubpkbhx6cxagoeqevg4a4oqq
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: hermes-agent-gateway
        namespace: "{{ .Release.Namespace }}"
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/instance: hermes-agent
            app.kubernetes.io/name: hermes-agent
        ingress:
          - fromEntities:
              - ingress
            toPorts:
              - ports:
                  - port: "9119"
                    protocol: TCP
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kanidm
                  k8s:app.kubernetes.io/name: kanidm-http-bridge
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: mcp-kubernetes
                  k8s:app.kubernetes.io/name: kubernetes-mcp-server
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: mcp-tmux
                  k8s:app.kubernetes.io/name: mcp
                  k8s:app.kubernetes.io/instance: mcp-tmux
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: mcp-woodpecker
                  k8s:app.kubernetes.io/instance: mcp-woodpecker
                  k8s:app.kubernetes.io/name: mcp-woodpecker
            toPorts:
              - ports:
                  - port: "8000"
                    protocol: TCP
  networkPolicy:
    enabled: true
    extraEgress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: mcp-kubernetes
            podSelector:
              matchLabels:
                app.kubernetes.io/name: kubernetes-mcp-server
                app.kubernetes.io/instance: mcp-kubernetes
        ports:
          - protocol: TCP
            port: 8080
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: mcp-woodpecker
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: mcp-woodpecker
                app.kubernetes.io/name: mcp-woodpecker
        ports:
          - protocol: TCP
            port: 8000
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: mcp-tmux
            podSelector:
              matchLabels:
                app.kubernetes.io/name: mcp
                app.kubernetes.io/instance: mcp-tmux
        ports:
          - protocol: TCP
            port: 8080
  dashboard:
    enabled: true
    publicUrl: https://hermes-agent.lajas.tech
    auth:
      provider: external
    trustedProxies:
      - 10.137.0.0/24
  service:
    enabled: true
  httpRoute:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    parentRefs:
      - name: public-gateway
        group: gateway.networking.k8s.io
        kind: Gateway
        namespace: kube-system
        sectionName: https
    hostnames:
      - hermes-agent.lajas.tech
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - port: 9119
